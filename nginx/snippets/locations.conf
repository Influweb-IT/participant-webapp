# Country-specific nginx locations (owned by this repo, never touched by copier update).
# Included inside the server block of default.conf, before the generic locations.
# Locations that use add_header must also
#   include /etc/nginx/snippets/security-headers.conf;
#
# Example, proxy a results page from a bucket:
# location /results-proxy/ {
#     include /etc/nginx/snippets/security-headers.conf;
#     proxy_pass https://storage.googleapis.com/my-results/;
#     proxy_ssl_server_name on;
#     proxy_set_header Host storage.googleapis.com;
#     add_header Cache-Control "no-cache" always;
# }
