# Country Content-Security-Policy directives (owned by this repo, never touched by copier update).
# One directive per line. Only the policy lives here: security-headers.conf (template) sends
# the header and appends upgrade-insecure-requests for https clients.
#
# Third parties and why they are here:
#   recaptcha  www.google.com/recaptcha, www.gstatic.com/recaptcha, recaptcha.google.com (signup/login)
#   iubenda    *.iubenda.com (cookie banner: script, consent API, preference frame)
#   facebook   connect.facebook.net (pixel script), www.facebook.com (pixel beacons)
#   ghost      blog-influweb-it.ghost.io (blog cards: content API); post images may be on any CDN
#   dashboard  /dashboard is same origin (Streamlit behind the ingress): frame-src 'self'
#
# 'unsafe-inline' scripts: the Facebook pixel bootstrap is injected inline (src/Facebook.tsx).
# 'unsafe-eval': kept from the previous policy for the third-party scripts; candidate for removal
# once checked against iubenda / facebook / recaptcha in a real browser session.

set $csp "default-src 'self'";
set $csp "${csp}; base-uri 'self'";
set $csp "${csp}; object-src 'none'";
set $csp "${csp}; frame-ancestors 'none'";
set $csp "${csp}; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net https://*.iubenda.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/";
set $csp "${csp}; style-src 'self' 'unsafe-inline' https://*.iubenda.com https://www.gstatic.com/recaptcha/";
set $csp "${csp}; img-src 'self' data: https:";
set $csp "${csp}; font-src 'self' data:";
set $csp "${csp}; media-src 'self' https://influweb.org https://*.influweb.org";
set $csp "${csp}; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://*.iubenda.com";
set $csp "${csp}; connect-src 'self' https://blog-influweb-it.ghost.io https://influweb.org https://*.influweb.org wss://influweb.org wss://*.influweb.org https://*.iubenda.com https://connect.facebook.net https://www.facebook.com https://www.google.com/recaptcha/";
