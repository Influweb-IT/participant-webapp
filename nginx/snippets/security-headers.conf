# Generated by participant-webapp-template: change it there, then `copier update`.
# Included in every location of default.conf (and should be in locations.conf ones).

add_header X-Content-Type-Options "nosniff" always;

# Content-Security-Policy: the country lists its directives in csp.conf (set $csp ...);
# how the header is sent lives here, so changing it is a template update for everyone.
# $csp_upgrade_insecure (default.conf) adds upgrade-insecure-requests for https clients only.
set $csp "";
include /etc/nginx/snippets/csp.conf;
add_header Content-Security-Policy "${csp}${csp_upgrade_insecure}" always;
