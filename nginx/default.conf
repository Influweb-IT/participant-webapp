# Generated by participant-webapp-template: change it there, then `copier update`.
# Country-specific bits go in nginx/snippets/locations.conf and nginx/snippets/csp.conf.
#
# nginx drops server-level add_header directives in any location that has its own
# add_header, so every location includes the security headers itself.

# CSP upgrade-insecure-requests, only for clients that reached us over https. The ingress
# terminates TLS and sets X-Forwarded-Proto: https, so production and staging always get
# it. A plain-http run (local `docker run`, tests) doesn't: there the directive would
# rewrite same-origin http:// URLs (e.g. an iframe on /dashboard) to an https:// origin
# that doesn't exist. Appended to the policy in snippets/security-headers.conf.
map $http_x_forwarded_proto $csp_upgrade_insecure {
    ~*^https  "; upgrade-insecure-requests";
    default   "";
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;
    etag on;

    # country-specific locations (proxies, redirects, ...)
    include /etc/nginx/snippets/locations.conf;

    # content-hashed build output (Vite build.assetsDir): cache forever
    # (no `always`: a 404 for a chunk of another deploy must not be cached)
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # content: configs, locales, images (same names, changing content)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # the app: index.html for every route
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
