# Generated by participant-webapp-template: change it there, then `copier update`.
name: Build docker image
run-name: ${{ inputs.image_version || 'latest git tag' }}${{ inputs.env_file && format(' ({0})', inputs.env_file) || '' }}

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Image tag (empty: latest git tag)"
        required: false
        type: string
      environment:
        description: "GitHub environment to use"
        required: false
        default: ""
        type: string
      env_file:
        description: "Env file baked in over .env, e.g. .env.staging (empty: .env only)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      image_version:
        required: false
        type: string
      environment:
        required: false
        default: ""
        type: string
      env_file:
        required: false
        default: ""
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASSWORD:
        required: true
      DOCKER_ORGANIZATION:
        required: true
      DOCKER_REPO_NAME:
        required: true
      INSTANCE_ID:
        required: false

jobs:
  build:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      # optional: overrides REACT_APP_DEFAULT_INSTANCE (job level, so step `if` can read it)
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Image name
        env:
          TAG: ${{ inputs.image_version }}
          ORG: ${{ secrets.DOCKER_ORGANIZATION }}
          REPO: ${{ secrets.DOCKER_REPO_NAME }}
        run: |
          if [ -z "$TAG" ]; then TAG=$(git describe --tags --abbrev=0); fi
          echo "IMAGE=$ORG/$REPO:$TAG" >> "$GITHUB_ENV"

      # .env.production.local overrides .env in the build; the env file goes first so that
      # INSTANCE_ID (appended below) wins over it: within one file the last value wins.
      - name: Env file
        if: ${{ inputs.env_file != '' }}
        env:
          ENV_FILE: ${{ inputs.env_file }}
        run: |
          case "$ENV_FILE" in
            .env.*) ;;
            *) echo "::error::env_file must be a .env.* file in the repo root, got '$ENV_FILE'"; exit 1 ;;
          esac
          case "$ENV_FILE" in
            */*|*.local) echo "::error::env_file must be a committed file in the repo root, got '$ENV_FILE'"; exit 1 ;;
          esac
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found on this branch"; exit 1; }
          cp "$ENV_FILE" .env.production.local
          echo "baked in over .env:"; grep -o '^[A-Z_]*=' "$ENV_FILE" | tr -d '='

      - name: Override instanceId
        if: ${{ env.INSTANCE_ID != '' }}
        run: echo "REACT_APP_DEFAULT_INSTANCE=$INSTANCE_ID" >> .env.production.local

      - name: Docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build
        run: docker build --pull --file Dockerfile --tag "$IMAGE" .

      - name: Push
        run: docker push "$IMAGE"
